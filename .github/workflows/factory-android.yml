name: Factory / Android
on:
  pull_request:
    paths: ["factory/android-smoke/**","factory/toolchain.json",".github/workflows/factory-android.yml"]
  push:
    branches: [main]
    paths: ["factory/android-smoke/**","factory/toolchain.json",".github/workflows/factory-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: factory/android-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Evidence
        run: |
          java -version
          gradle --version
          sdkmanager --version
      - name: Lint
        run: gradle --no-daemon lintDebug
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee app/build/ANDROID-APK-SHA256.txt
          printf 'platform=android\nagp=9.4.0\ngradle=9.6.0\njdk=17\ncompileSdk=37\nbuildTools=36.0.0\ncommit=%s\n' "$GITHUB_SHA" > app/build/BUILD-MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-factory-android
          path: |
            factory/android-smoke/app/build/outputs/apk/debug/*.apk
            factory/android-smoke/app/build/ANDROID-APK-SHA256.txt
            factory/android-smoke/app/build/BUILD-MANIFEST.txt
          if-no-files-found: error
